<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmation</title>

    {% comment %} <link rel="stylesheet" href="styles.css"> {% endcomment %}
    
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: cyan;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: #3498db;
            color: #fff;
            padding: 10px;
        }

        h1 {
            color: #333;
        }

        .confirmation-container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        a {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 20px;
            background-color: #3498db;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        a:hover {
            background-color: #2980b9;
        }
    </style>
</head>

<body>

    <header>
        <h1>Booking Confirmed in location name {{ location_name }}</h1>
    </header>

    <div class="confirmation-container">
        <p>Your location is confirmed and We look forward to welcoming you!</p>
        <a href="/reserve_list/">View Reservation Details</a>
    </div>

</body>

</html>
