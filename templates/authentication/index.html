<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <meta charset="UTF-8">
    <title>Authentication</title>
</head>
<body id="body_index">
    <div id="message">

        {% for message in messages %}

        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            <strong>Message:</strong> {{ message }}
            <button type="button" class="close" data-dismiss="alert" aria-label="close">
            <span aria-hidden="true">&times;</span>
            </button>
        </div>
        {% endfor %}
    </div>
    
    <div id="options">
        <a href="" target="_blank">Home</a>
        <a href="about">About</a>
        <a href="service">Service</a>
        <a href="contact">Contact</a>
    </div>
    <h1> Welcome to E-Vehicle Reservation Platform</h1>
    <div id="inside">
        <h3>For new users, sign up here:</h3><br>
        <button type="submit"><a href="/signup">Sign Up</a></button><br><br>
        <h3>Existing users, sign in here:</h3><br>
        <button type="submit"><a href="/signin">Sign In</a></button><br><br>
    </div>
</body>
</html>
