<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/signup.css'%}">
    <meta charset="UTF-8">
    <title>SignUp</title>
</head>
<body id="body_index">
    <div id="inside">
        <img src="../static/images/signup.jpg" style="width:30px;height:30px;">
        <h1> SIGNUP </h1>
        <form action="/signup" method="post">
            {% csrf_token %}    
            <label for="">User Name:</label>
            <input type="text" id="username" name="username" placeholder="Crate a user name(only letters and numbers)" Required>
            <br>
            <br>
            <label for="">First Name:</label>
            <input type="text" id="fname" name="fname" placeholder="Enter your first name" Required>
            <br>
            <br>
            <label for="">Last Name:</label>
            <input type="text" id="lname" name="lname" placeholder="Enter your last name" Required>
            <br>
            <br>
            <label for="">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Enter your Email address" Required>
            <br>
            <br>
            <label for="">Password:</label>
            <input type="password" id="pass1" name="pass1" placeholder="Create Password" Required>
            <br>
            <br>
            <label for="">confirm Password:</label>
            <input type="password" id="pass2" name="pass2" placeholder="Confirm your password" Required>
            <br>
            <br>
            <button type="submit">Sign Up</button>
        </form>
    </div>
</body>
</html>
